name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set dummy env vars for tests
        run: |
          echo "ANTHROPIC_API_KEY=sk-ant-test-dummy" >> $GITHUB_ENV
          echo "POLYMARKET_API_KEY=test-dummy" >> $GITHUB_ENV
          echo "POLYMARKET_PRIVATE_KEY=0xdummy" >> $GITHUB_ENV
          echo "PERPLEXITY_API_KEY=pplx-test-dummy" >> $GITHUB_ENV
          echo "TELEGRAM_BOT_TOKEN=test:dummy" >> $GITHUB_ENV
          echo "TELEGRAM_CHAT_ID=123456" >> $GITHUB_ENV
          echo "DB_PATH=:memory:" >> $GITHUB_ENV

      - name: Lint with ruff
        run: ruff check core/ execution/ infra/ pipeline/

      - name: Type check with mypy
        run: mypy core/ execution/ infra/ pipeline/ --strict

      - name: Run tests
        run: pytest tests/ -v --tb=short
